<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dongle Finance | Configurações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <span>$</span> Dongle Finance
            </div>
            
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="estimativas.html" class="nav-link">Estimativas</a>
                <a href="relatorios.html" class="nav-link">Relatórios</a>
                <a href="configuracoes.html" class="nav-link active">Configurações</a>
            </nav>

            <a href="index.html#modal-transacao" class="btn-primary">+ Nova Transação</a>
        </div>
    </header>

    <main class="dashboard-container">
        <h2>Configurações da Conta</h2>

        <div class="settings-card">
            <form style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" value="Seu Nome">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" value="usuario@email.com">
                </div>

                <div class="form-group">
                    <label for="moeda">Moeda Principal</label>
                    <select id="moeda">
                        <option value="BRL">Real Brasileiro (R$)</option>
                        <option value="USD">Dólar Americano ($)</option>
                        <option value="EUR">Euro (€)</option>
                    </select>
                </div>

                <div>
                    <button type="button" class="btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
